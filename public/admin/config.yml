backend:
  name: github
  repo: aisuccessforum/analytics
  branch: main
  base_url: https://aisuccessforum.online
  auth_endpoint: callback

media_folder: public/images/posts
public_folder: /images/posts

media_library:
  name: cloudinary
  config:
    cloud_name: dtryodpcq
    api_key: 538344419198733

collections:
  # ── ARTICLES ──────────────────────────────────────────────
  - name: posts
    label: Articles
    folder: content/posts
    create: true
    slug: "{{slug}}"
    extension: md
    format: frontmatter
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: Publish Date, name: date, widget: datetime, format: YYYY-MM-DD }
      - { label: Updated Date, name: updated, widget: datetime, format: YYYY-MM-DD, required: false }
      - { label: Author, name: author, widget: string, default: AI Success Forum Team }
      - label: Category
        name: category
        widget: select
        options:
          - { label: AI Tools, value: ai-tools }
          - { label: Career Growth, value: career-growth }
          - { label: Business & Income, value: business-income }
          - { label: Productivity, value: productivity }
          - { label: Motivation, value: motivation }
          - { label: Courses, value: courses }
          - { label: Laptops, value: laptops }
          - { label: AI News, value: ai-news }
      - { label: Tags, name: tags, widget: list, default: [] }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Cover Image, name: coverImage, widget: image, required: false }
      - label: Affiliate Products
        name: affiliate
        widget: list
        required: false
        hint: "Enter affiliate product keys e.g. chatgpt-plus, claude-pro"
      - { label: Draft, name: draft, widget: boolean, default: false }
      - { label: Article Content, name: body, widget: markdown }

  # ── AFFILIATES ────────────────────────────────────────────
  - name: settings
    label: Site Settings
    files:
      - label: General Settings
        name: site
        file: data/site.json
        fields:
          - { label: Site Name, name: name, widget: string }
          - { label: Tagline, name: tagline, widget: string }
          - { label: Description, name: description, widget: text }
          - { label: Site URL, name: url, widget: string }
          - { label: Author, name: author, widget: string }
          - { label: Email, name: email, widget: string }
          - label: Social Links
            name: social
            widget: object
            fields:
              - { label: Twitter/X, name: twitter, widget: string, required: false }
              - { label: YouTube, name: youtube, widget: string, required: false }
              - { label: LinkedIn, name: linkedin, widget: string, required: false }
              - { label: Instagram, name: instagram, widget: string, required: false }
          - label: Newsletter
            name: newsletter
            widget: object
            fields:
              - { label: Heading, name: heading, widget: string }
              - { label: Subheading, name: subheading, widget: string }
              - { label: Placeholder, name: placeholder, widget: string }
              - { label: Button Text, name: cta, widget: string }

      - label: Categories
        name: categories
        file: data/categories.json
        fields:
          - label: Categories List
            name: categories
            widget: list
            fields:
              - { label: Slug, name: slug, widget: string }
              - { label: Name, name: name, widget: string }
              - { label: Description, name: description, widget: text }
              - { label: Icon, name: icon, widget: string }
              - { label: Color Class, name: color, widget: string }
              - { label: Accent Color, name: accentColor, widget: string }
